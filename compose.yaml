services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lindy
      POSTGRES_USER: lindy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - lindy_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lindy -d lindy"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://lindy:${POSTGRES_PASSWORD}@database:5432/lindy
      DATABASE_SSL_MODE: disable
      MIGRATE_ON_START: "true"
      PUBLIC_ORGANIZATION_SLUG: demo-sales
      ALLOWED_ORIGINS: http://localhost:3001
      TRUST_PROXY_HOPS: 0
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      PRIVACY_HASH_SECRET: ${PRIVACY_HASH_SECRET:?set PRIVACY_HASH_SECRET}
      COOKIE_SECURE: "false"
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  lindy_database:
